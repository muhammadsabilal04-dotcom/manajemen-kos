<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Kos Omah Gading & Living Kost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4" id="body-container">

    <!-- HALAMAN LOGIN GOOGLE -->
    <div id="login-screen" class="bg-white rounded-xl shadow-md p-8 max-w-sm w-full text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Login Privasi Kos</h1>
        <p class="text-gray-500 text-mb mb-6 text-sm">Gunakan akun Google yang berizin untuk masuk ke sistem.</p>
        
        <button onclick="handleGoogleLogin()" class="w-full py-3 bg-white border border-gray-300 text-gray-700 rounded-lg font-semibold shadow-sm hover:bg-gray-50 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Masuk dengan Google
        </button>
        <p id="login-error" class="text-red-500 text-xs text-center mt-4 hidden">Akses ditolak! Email Anda tidak terdaftar dalam sistem.</p>
    </div>

    <!-- HALAMAN UTAMA APLIKASI KOS -->
    <div id="app-screen" class="hidden max-w-4xl w-full bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Manajemen Kos-Kosan</h1>
                <p class="text-gray-500 text-sm">Omah Gading & Living Kost</p>
            </div>
            <button onclick="handleLogout()" class="px-3 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300">Keluar</button>
        </div>

        <!-- Pilihan Gedung -->
        <div class="flex justify-center gap-4 mb-6">
            <button onclick="switchBuilding('Omah Gading')" id="btn-omah" class="px-6 py-2 rounded-lg font-semibold bg-blue-600 text-white shadow">Omah Gading</button>
            <button onclick="switchBuilding('Living Kost')" id="btn-living" class="px-6 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700">Living Kost</button>
        </div>

        <!-- Judul Gedung Aktif -->
        <h2 id="current-building-title" class="text-xl font-bold text-gray-700 mb-4">Daftar Kamar: Omah Gading</h2>
        
        <!-- Kontainer Daftar Kamar Berdasarkan Kategori -->
        <div id="room-sections-container" class="space-y-6"></div>
    </div>

    <!-- MODAL DETAIL KAMAR -->
    <div id="room-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-md w-full">
            <h3 id="modal-room-title" class="text-xl font-bold mb-4 text-gray-800">Detail Kamar</h3>
            
            <div id="modal-overview" class="space-y-4">
                <div class="bg-gray-50 p-4 rounded-xl border space-y-2 text-sm text-gray-700">
                    <p><strong>Nama Penyewa:</strong> <span id="ov-name" class="text-gray-900">-</span></p>
                    <p><strong>Periode Sewa:</strong> <span id="ov-period" class="text-gray-900">-</span></p>
                    <p><strong>Status Pembayaran:</strong> <span id="ov-payment" class="font-semibold">-</span></p>
                    <p><strong>Foto KTP:</strong> <span id="ov-ktp">-</span></p>
                </div>
                
                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="clearRoomData()" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm font-semibold hover:bg-red-200 transition">Kosongkan Kamar</button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg text-gray-700 text-sm font-medium">Tutup</button>
                        <button type="button" onclick="showEditForm()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition">Edit Data</button>
                    </div>
                </div>
            </div>

            <form id="room-form" onsubmit="saveRoomData(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Penyewa / Tamu</label>
                    <input type="text" id="tenant-name" class="w-full mt-1 p-2 border rounded-lg text-sm" placeholder="Nama lengkap" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Upload Foto KTP Baru (Opsional)</label>
                    <input type="file" id="ktp-file" class="w-full mt-1 p-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Mulai Sewa</label>
                        <input type="date" id="start-date" class="w-full mt-1 p-2 border rounded-lg text-sm" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Jatuh Tempo</label>
                        <input type="date" id="end-date" class="w-full mt-1 p-2 border rounded-lg text-sm" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status Pembayaran Bulan Ini</label>
                    <select id="payment-status" class="w-full mt-1 p-2 border rounded-lg text-sm">
                        <option value="Lunas">Lunas</option>
                        <option value="Belum Lunas">Belum Lunas</option>
                    </select>
                </div>
                
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cancelEdit()" class="px-4 py-2 bg-gray-200 rounded-lg text-gray-700 text-sm">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://buxsllutgupfpytzckiz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N2xFBsIOZCGJxwxTmHVGMg_h4itJtY3';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DAFTAR EMAIL YANG DIIZINKAN MASUK (Ubah sesuai email kamu & pegawai)
        const ALLOWED_EMAILS = [
            "muhammadsabilal04@gmail.com",
            "kuduskartini@gmail.com",
            "omahgading93@gmail.com",
            "livingkostkudus@gmail.com"
        ];

        let activeBuilding = 'Omah Gading';
        let selectedRoomNumber = '';
        let currentTenantData = null;

        // Cek status login saat halaman dibuka
        window.onload = async function() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                validateAndOpenApp(session.user.email);
            }
        };

        async function handleGoogleLogin() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href
                }
            });
            if (error) {
                alert("Gagal login dengan Google: " + error.message);
            }
        }

        async function validateAndOpenApp(email) {
            const errorText = document.getElementById('login-error');
            if (ALLOWED_EMAILS.includes(email)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('body-container').className = "bg-gray-100 min-h-screen p-4";
                document.getElementById('app-screen').classList.remove('hidden');
                loadRooms();
            } else {
                errorText.classList.remove('hidden');
                await _supabase.auth.signOut();
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        async function loadRooms() {
            const container = document.getElementById('room-sections-container');
            container.innerHTML = '<p class="text-gray-500 text-center">Memuat data kamar...</p>';

            const { data: rooms, error } = await _supabase
                .from('rooms')
                .select('*')
                .eq('building', activeBuilding);

            if (error) {
                container.innerHTML = '<p class="text-red-500 text-center">Gagal memuat kamar.</p>';
                return;
            }

            rooms.sort((a, b) => {
                return a.room_number.localeCompare(b.room_number, undefined, { numeric: true, sensitivity: 'base' });
            });

            container.innerHTML = '';

            if (activeBuilding === 'Omah Gading') {
                const lantai1 = rooms.filter(r => r.room_number.startsWith('K1.'));
                const lantai2 = rooms.filter(r => r.room_number.startsWith('K2.'));
                if (lantai1.length > 0) renderSection(container, 'Lantai 1', lantai1);
                if (lantai2.length > 0) renderSection(container, 'Lantai 2', lantai2);
            } else {
                const kamarA = rooms.filter(r => r.room_number.startsWith('A'));
                const kamarB = rooms.filter(r => r.room_number.startsWith('B'));
                const kamarC = rooms.filter(r => r.room_number.startsWith('C'));
                if (kamarA.length > 0) renderSection(container, 'Kamar A', kamarA);
                if (kamarB.length > 0) renderSection(container, 'Kamar B', kamarB);
                if (kamarC.length > 0) renderSection(container, 'Kamar C', kamarC);
            }
        }

        function renderSection(parentContainer, sectionTitle, roomList) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = "bg-gray-50 p-4 rounded-xl border";

            const titleH3 = document.createElement('h3');
            titleH3.className = "text-md font-bold text-gray-700 mb-3";
            titleH3.innerText = sectionTitle;
            sectionDiv.appendChild(titleH3);

            const gridDiv = document.createElement('div');
            gridDiv.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3";

            roomList.forEach(room => {
                const isKosong = room.status === 'Kosong';
                const bgColor = isKosong ? 'bg-red-50 border-red-300 text-red-700' : 'bg-green-50 border-green-300 text-green-700';
                
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border-2 cursor-pointer flex flex-col items-center justify-center transition hover:shadow-md ${bgColor}`;
                card.innerHTML = `
                    <span class="text-base font-bold">${room.room_number}</span>
                    <span class="text-[10px] mt-1 font-medium px-2 py-0.5 rounded ${isKosong ? 'bg-red-200 text-red-800' : 'bg-green-200 text-green-800'}">${room.status}</span>
                `;
                card.onclick = () => openModal(room.room_number);
                gridDiv.appendChild(card);
            });

            sectionDiv.appendChild(gridDiv);
            parentContainer.appendChild(sectionDiv);
        }

        function switchBuilding(building) {
            activeBuilding = building;
            document.getElementById('current-building-title').innerText = `Daftar Kamar: ${building}`;
            
            if (building === 'Omah Gading') {
                document.getElementById('btn-omah').className = 'px-6 py-2 rounded-lg font-semibold bg-blue-600 text-white shadow';
                document.getElementById('btn-living').className = 'px-6 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700';
            } else {
                document.getElementById('btn-living').className = 'px-6 py-2 rounded-lg font-semibold bg-blue-600 text-white shadow';
                document.getElementById('btn-omah').className = 'px-6 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700';
            }
            loadRooms();
        }

        async function openModal(roomNumber) {
            selectedRoomNumber = roomNumber;
            document.getElementById('modal-room-title').innerText = `Kamar ${roomNumber} (${activeBuilding})`;
            document.getElementById('room-modal').classList.remove('hidden');

            document.getElementById('modal-overview').classList.add('hidden');
            document.getElementById('room-form').classList.add('hidden');

            const { data: tenant } = await _supabase.from('tenants').select('*').eq('room_number', roomNumber).maybeSingle();
            const { data: payment } = await _supabase.from('payments').select('*').eq('room_number', roomNumber).maybeSingle();

            currentTenantData = tenant;

            if (tenant) {
                document.getElementById('modal-overview').classList.remove('hidden');
                document.getElementById('ov-name').innerText = tenant.name || '-';
                document.getElementById('ov-period').innerText = `${tenant.start_date || '-'} s/d ${tenant.end_date || '-'}`;
                
                const payStatus = payment ? payment.status : '-';
                const paySpan = document.getElementById('ov-payment');
                paySpan.innerText = payStatus;
                paySpan.className = payStatus === 'Lunas' ? 'text-green-600 font-semibold' : 'text-red-600 font-semibold';

                const ktpSpan = document.getElementById('ov-ktp');
                if (tenant.id_card_url) {
                    ktpSpan.innerHTML = `<a href="${tenant.id_card_url}" target="_blank" class="text-blue-600 underline font-medium hover:text-blue-800">Lihat Foto KTP</a>`;
                } else {
                    ktpSpan.innerText = 'Tidak ada foto';
                }
            } else {
                showEditForm();
            }
        }

        function showEditForm() {
            document.getElementById('modal-overview').classList.add('hidden');
            document.getElementById('room-form').classList.remove('hidden');

            if (currentTenantData) {
                document.getElementById('tenant-name').value = currentTenantData.name || '';
                document.getElementById('start-date').value = currentTenantData.start_date || '';
                document.getElementById('end-date').value = currentTenantData.end_date || '';
            } else {
                document.getElementById('room-form').reset();
            }
        }

        function cancelEdit() {
            if (currentTenantData) {
                document.getElementById('room-form').classList.add('hidden');
                document.getElementById('modal-overview').classList.remove('hidden');
            } else {
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('room-modal').classList.add('hidden');
        }

        async function clearRoomData() {
            if (!confirm(`Yakin ingin mengosongkan Kamar ${selectedRoomNumber}? Data penyewa akan dihapus.`)) return;

            await _supabase.from('tenants').delete().eq('room_number', selectedRoomNumber);
            await _supabase.from('payments').delete().eq('room_number', selectedRoomNumber);
            await _supabase.from('rooms').update({ status: 'Kosong' }).eq('room_number', selectedRoomNumber);

            alert('Kamar berhasil dikosongkan!');
            closeModal();
            loadRooms();
        }

        async function saveRoomData(event) {
            event.preventDefault();
            const name = document.getElementById('tenant-name').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const paymentStatus = document.getElementById('payment-status').value;
            const fileInput = document.getElementById('ktp-file').files[0];

            let ktpUrl = currentTenantData ? currentTenantData.id_card_url : '';

            if (fileInput) {
                const fileName = `${selectedRoomNumber}_${Date.now()}_${fileInput.name}`;
                const { error: uploadError } = await _supabase.storage
                    .from('ktp-photos')
                    .upload(fileName, fileInput);

                if (uploadError) {
                    alert('Gagal mengupload foto KTP: ' + uploadError.message);
                    return;
                }

                const { data: publicUrlData } = _supabase.storage
                    .from('ktp-photos')
                    .getPublicUrl(fileName);
                
                ktpUrl = publicUrlData.publicUrl;
            }

            await _supabase.from('tenants').upsert({
                room_number: selectedRoomNumber,
                name: name,
                id_card_url: ktpUrl || undefined,
                start_date: startDate,
                end_date: endDate
            }, { onConflict: 'room_number' });

            await _supabase.from('rooms').update({ status: 'Terisi' }).eq('room_number', selectedRoomNumber);

            await _supabase.from('payments').upsert({
                room_number: selectedRoomNumber,
                amount: 0,
                payment_date: new Date().toISOString().split('T')[0],
                status: paymentStatus
            }, { onConflict: 'room_number' });

            alert('Data berhasil disimpan!');
            closeModal();
            loadRooms();
        }
    </script>
</body>
</html>
